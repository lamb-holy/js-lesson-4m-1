<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .modal {
            display: none;
        }

        .modal.show {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 400px;
            min-height: 300px;
            padding: 15px;
            background-color: brown;
            transform: translate(-50%, -50%);
            display: block;
        }

        .plusminus {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            margin-top: 40px;
        }

        .product {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            border: 1px solid black;
            width: 100px;
            height: 50px;
            background-color: gray;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="change">змінити тему</button>

        <button class="open">Докладніше</button>
        <div class="modal">
            <button class="close">X</button>
            <p>Lorem ipsum dolor sit.</p>
        </div>

        <div class="plusminus">
            <button class="minus">-</button>
            <p class="amount">0</p>
            <button class="plus">+</button>
        </div>

        <button class="add-to-cart">додати в кошик</button>

        <div class="cart">
            <h2>кошик</h2>
        </div>

    </div>

    



    <script src="appapa.js"></script>
</body>
</html>
